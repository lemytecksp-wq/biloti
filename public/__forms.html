<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netlify Forms</title>
</head>

<body>

  <form
    name="contact"
    method="POST"
    data-netlify="true"
    data-netlify-honeypot="bot-field"
    hidden
  >

    <input
      type="hidden"
      name="form-name"
      value="contact"
    />

    <input
      type="text"
      name="bot-field"
    />

    <input
      type="text"
      name="fullName"
    />

    <input
      type="email"
      name="email"
    />

    <input
      type="tel"
      name="phone"
    />

    <select name="service">
      <option value="General Enquiry">
        General Enquiry
      </option>

      <option value="Water Blasting">
        Water Blasting / Pressure Washing
      </option>

      <option value="Commercial Cleaning">
        Commercial / Office Cleaning
      </option>

      <option value="Residential Cleaning">
        Residential Cleaning
      </option>

      <option value="Pest Control">
        Pest Control
      </option>

      <option value="Garden Maintenance">
        Garden Maintenance / Lawn Care
      </option>

      <option value="Other">
        Other
      </option>
    </select>

    <textarea name="message"></textarea>

    <input
      type="checkbox"
      name="privacyConsent"
    />

    <button type="submit">
      Submit
    </button>

  </form>

</body>
</html>
