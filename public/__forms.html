<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Netlify Forms</title></head>
<body>
  <form name="contact" method="POST" data-netlify="true" style="position:absolute;overflow:hidden;clip:rect(0 0 0 0);height:1px;width:1px;margin:-1px;padding:0;border:0;">
    <input type="hidden" name="form-name" value="contact" />
    <input type="text" name="fullName" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <select name="service">
      <option value="General Enquiry">General Enquiry</option>
      <option value="Water Blasting">Water Blasting / Pressure Washing</option>
      <option value="Commercial Cleaning">Commercial / Office Cleaning</option>
      <option value="Residential Cleaning">Residential Cleaning</option>
      <option value="Pest Control">Pest Control</option>
      <option value="Garden Maintenance">Garden Maintenance / Lawn Care</option>
      <option value="Other">Other</option>
    </select>
    <textarea name="message"></textarea>
    <input type="text" name="privacyConsent" />
  </form>
</body>
</html>
